{# Progress bar plus the poller that reloads the page when the job finishes. #}
{% macro progress(job, name) %}
  {% if job.status == 'running' %}
    <div class="progress" id="progress-box">
      <div class="bar"><span style="width: {{ job.percent }}%"></span></div>
      <p class="muted" id="progress-label">{{ job.label }}…</p>
    </div>
    <script>
      // Poll until the worker thread reports done or error, then reload so the
      // server can render the finished result.
      const poll = setInterval(async () => {
        const response = await fetch("{{ url_for('job_status', name=name) }}");
        const job = await response.json();
        document.querySelector("#progress-box .bar span").style.width = job.percent + "%";
        document.getElementById("progress-label").textContent = job.label + "…";
        if (job.status === "done" || job.status === "error") {
          clearInterval(poll);
          location.reload();
        }
      }, 1000);
    </script>
  {% elif job.status == 'error' %}
    <div class="flash error">Failed: {{ job.error }}</div>
  {% endif %}
{% endmacro %}
