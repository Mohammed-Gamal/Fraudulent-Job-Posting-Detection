[project]
name = "fraudulent-job-posting-detection"
version = "0.1.0"
description = "Text mining pipeline for detecting fraudulent job postings in the EMSCAD dataset"
readme = "README.md"
authors = [
    { name = "Mohamed Gamal", email = "1Mohamed.Gamal54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "nltk>=3.8",
    "imbalanced-learn>=0.12",
    "pyarrow>=16.0",
    "joblib>=1.4",
    "tabulate>=0.9",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
fjpd = "fraudulent_job_posting_detection.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
